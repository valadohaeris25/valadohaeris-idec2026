    <script>
const video = document.getElementById('video');
const playBtn = document.getElementById('playPause');
const muteBtn = document.getElementById('muteBtn');
const progressBar = document.getElementById('progressBar');
const progressContainer = document.getElementById('progressContainer');
const timeDisplay = document.getElementById('timeDisplay');

// 播放 / 暂停
playBtn.addEventListener('click', () => {
    if (video.paused) {
        video.play();
        playBtn.querySelector('i').className = 'fas fa-pause';
    } else {
        video.pause();
        playBtn.querySelector('i').className = 'fas fa-play';
    }
});

// 静音
muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    muteBtn.querySelector('i').className = video.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
});

// 进度更新
video.addEventListener('timeupdate', () => {
    const percent = (video.currentTime / video.duration) * 100 || 0;
    progressBar.style.width = percent + '%';
    timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
});

// 点击进度条跳转
progressContainer.addEventListener('click', (e) => {
    const rect = progressContainer.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    video.currentTime = ratio * video.duration;
});

function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}
    </script>
    <script>
    const videoBox = document.querySelector('.video-container');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('drop-in');
                observer.unobserve(entry.target);   // 只触发一次
            }
        });
    }, {
        threshold: 0.6  // 露出 20% 就触发
    });

    observer.observe(videoBox);
</script>
